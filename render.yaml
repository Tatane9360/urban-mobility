services:
  - type: web
    name: urban-mobility-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: urban-mobility-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: urban-mobility-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: urban-mobility-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: urban-mobility-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: urban-mobility-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: GTFS_STATIC_URL
        sync: false
      - key: GBFS_STATION_INFORMATION_URL
        sync: false
      - key: GBFS_STATION_STATUS_URL
        sync: false
      - key: GTFS_RT_URBAIN_VEHICLE_POSITION_URL
        sync: false
      - key: GTFS_RT_SUBURBAIN_VEHICLE_POSITION_URL
        sync: false
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: THROTTLE_TTL_MS
        value: 60000
      - key: THROTTLE_LIMIT
        value: 100

databases:
  - name: urban-mobility-db
    plan: free
    postgresMajorVersion: 16
