<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="UrbanFlow">
  <!-- Montpellier's Arc de Triomphe with a path winding under the archway,
       redrawn from logo-urban-flow.webp as strokes, matching its line-art
       treatment. Colours sampled from that file: #1d3c5d and #7aba8e.
       Two tokens with fallbacks, so the file also works standalone. -->
  <g
    fill="none"
    stroke="var(--logo-arc, #1d3c5d)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Chamfered roofline over the entablature: shallow, so the cornice reads
         as a wide flat cap rather than a pitched roof -->
    <path d="M12 24 20 16h24l8 8" />
    <path d="M18 24h28" />
    <!-- Outer piers and their inner faces, the recess holding the vault -->
    <path d="M13 24v25" />
    <path d="M51 24v25" />
    <path d="M20 27v22" />
    <path d="M44 27v22" />
    <!-- Blind arches inside each pier -->
    <path d="M15.5 44v-8a1.6 1.6 0 0 1 3.2 0v8" />
    <path d="M45.3 44v-8a1.6 1.6 0 0 1 3.2 0v8" />
    <!-- Main vault, springing from the inner piers over the roadway -->
    <path d="M25 49V36a7 7 0 0 1 14 0v13" />
    <!-- Plinth, left open where the path crosses it -->
    <path d="M10 53h8" />
    <path d="M41 53h13" />
  </g>
  <!-- The path: enters bottom-left, doubles back through the archway in an S,
       then runs out to the right. The reversal is the mark's signature — a
       plain diagonal loses it. Drawn last, so it passes in front of the
       plinth. -->
  <path
    d="M8 56c8 1 14-1 18-6s-3-8 1-12 8-3 12-4 8 0 14-1"
    fill="none"
    stroke="var(--logo-route, #7aba8e)"
    stroke-width="2.8"
    stroke-linecap="round"
  />
</svg>
